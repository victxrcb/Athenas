name: warm-cache
# Compila o app na master só para gravar o cache Rust que o workflow de release reaproveita.
# (Runs disparados por tag só conseguem ler cache da branch padrão, não de outras tags.)
on:
  push:
    branches: [master]
    paths:
      - 'src-tauri/**'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:
concurrency:
  group: warm-cache
  cancel-in-progress: true
jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-release
      - run: npm ci
      # Mesmo perfil/features do release, sem gerar instaladores nem assinar.
      - run: npx tauri build --no-bundle ${{ matrix.args }}
