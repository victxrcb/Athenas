[package]
name = "athenas-agent"
version = "0.1.14"
description = "Local desktop workspace for coding agents"
authors = ["Athenas Agent"]
edition = "2021"

[lib]
name = "athenas_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
portable-pty = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
shell-words = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.31.4"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem"] }
windows = { version = "0.62", features = ["Foundation", "Media_Control"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
