[package]
name = "athenas-agent"
version = "0.1.0"
description = "Local desktop workspace for coding agents"
authors = ["Athenas Agent"]
edition = "2021"

[lib]
name = "athenas_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
shell-words = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
